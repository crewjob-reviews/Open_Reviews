<!DOCTYPE html>

<head>

<title>승무원 면접 후기 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; display:flex; align-items:center; justify-content:center; padding:24px 16px;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#2b3f52;
  background:linear-gradient(180deg,#9fc1df 0%,#b3cfe7 45%,#f3f7fb 100%); }
.box { width:100%; max-width:440px; background:#fff; border-radius:22px; padding:28px 24px 24px; text-align:center;
  box-shadow:0 8px 24px rgba(46,90,130,.12); line-height:1.75; font-size:0.95rem; }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:1.45rem; color:#24476a; margin:0 0 10px; }
p { margin:0 0 10px; }
.muted { color:#7890a6; font-size:0.85rem; }
.btn { display:block; margin-top:14px; padding:13px 16px; border-radius:999px; text-decoration:none; font-family:'Jua',sans-serif; font-size:1.05rem; }
.btn.primary { background:#4f86b8; color:#fff; }
.btn.secondary { background:#fff; color:#2e5a82; border:2px solid #c5d9ea; }
.btn:focus-visible { outline:3px solid #b3cfe7; outline-offset:2px; }
</style>
</head>
<body>
<div class="box">
  <h1>전체 후기 주소가 바뀌었어요</h1>
  <p>이전에 폼을 작성하셨던 분은 <b>'내 준비 현황 공유하기'</b>를 한 번 더 작성해주시면 새 주소를 받으실 수 있어요. 1분이면 돼요.</p>
  <a class="btn primary" href="https://docs.google.com/forms/d/e/1FAIpQLSfAiHD9-c0vf5SMuMc-YOpGlyi2Zr5htTMixgWmhZ5xdsa1ZA/viewform?usp=header">👋 내 준비 현황 공유하기</a>
  <a class="btn secondary" href="index.html">후기 페이지로 가기</a>
  <p class="muted" style="margin-top:14px;">잠시 후 후기 페이지로 자동 이동합니다</p>
</div>
</body>
</html>
